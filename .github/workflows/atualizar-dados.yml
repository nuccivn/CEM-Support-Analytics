name: Atualizar dados do painel

on:
  schedule:
    # 07:00 America/Sao_Paulo (UTC-3), todo dia - fallback caso ninguém
    # abra o painel por um tempo (o normal é o próprio painel disparar
    # isso via api/refresh.js a cada carregamento de página).
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dias:
        description: "Quantos dias de histórico buscar (30/90/180/270/365)"
        required: false
        default: "365"

# Se várias pessoas carregarem o painel ao mesmo tempo, as execuções
# disparadas ficam em fila em vez de rodar em paralelo — evita duas
# cargas batendo no limite de requisições da Movidesk ao mesmo tempo e
# dois "git push" concorrentes.
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar pipeline (carga da API do Movidesk -> dashboard_data.json)
        env:
          MOVIDESK_TOKEN: ${{ secrets.MOVIDESK_TOKEN }}
          MOVIDESK_DIAS: ${{ github.event.inputs.dias || '365' }}
        run: |
          python scripts/01_carga.py
          python scripts/02_limpeza.py
          python scripts/03_eda.py
          python scripts/04_cruzamentos.py
          python scripts/05_graficos.py
          python scripts/06_dashboard_data.py

      - name: Commitar e enviar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados hoje."
          else
            git commit -m "Atualização automática dos dados do painel"
            git push
          fi
